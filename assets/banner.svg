<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="pinkAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .glow-orb-1 {
      animation: floatOrb1 12s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      animation: floatOrb2 14s ease-in-out infinite alternate;
    }
    .pulse-node {
      animation: pulseNode 3s ease-in-out infinite alternate;
    }
    .flow-dash {
      stroke-dasharray: 8, 8;
      animation: dashFlow 20s linear infinite;
    }
    .spec-pill {
      transition: transform 0.3s ease;
      animation: floatPill 6s ease-in-out infinite alternate;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes floatOrb1 {
      0% { cx: 200px; cy: 120px; r: 160px; opacity: 0.35; }
      100% { cx: 350px; cy: 260px; r: 210px; opacity: 0.5; }
    }
    @keyframes floatOrb2 {
      0% { cx: 980px; cy: 280px; r: 180px; opacity: 0.35; }
      100% { cx: 850px; cy: 140px; r: 220px; opacity: 0.55; }
    }
    @keyframes pulseNode {
      0% { r: 5px; opacity: 0.6; }
      100% { r: 9px; opacity: 1; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="glow-orb-1" cx="200" cy="120" r="170" fill="#38bdf8" filter="url(#glow)" />
  <circle class="glow-orb-2" cx="980" cy="280" r="190" fill="#8b5cf6" filter="url(#glow)" />

  <!-- Dynamic Flow Connector Curves in Background (Behind Text) -->
  <g opacity="0.35">
    <path class="flow-dash" d="M 50,340 C 300,380 400,290 600,340 C 800,390 950,300 1150,340" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-dash" d="M 50,80 C 250,30 450,110 600,70 C 800,30 1000,100 1150,60" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Flow Nodes Background Accent -->
  <circle class="pulse-node" cx="250" cy="80" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="pulse-node" cx="600" cy="70" r="7" fill="#818cf8" filter="url(#glow)"/>
  <circle class="pulse-node" cx="950" cy="60" r="6" fill="#c084fc" filter="url(#glow)"/>
  <circle class="pulse-node" cx="300" cy="340" r="6" fill="#06b6d4" filter="url(#glow)"/>
  <circle class="pulse-node" cx="600" cy="340" r="7" fill="#8b5cf6" filter="url(#glow)"/>
  <circle class="pulse-node" cx="900" cy="340" r="6" fill="#ec4899" filter="url(#glow)"/>

  <!-- Top Badge / Category Pill -->
  <g transform="translate(430, 48)">
    <rect width="340" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="35" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">
      CENTRALIZED SCHEMA REGISTRY ECOSYSTEM
    </text>
  </g>

  <!-- FOREGROUND: Main Title and Subtitles (Completely Clear and Legible) -->
  <g id="foreground-content">
    <!-- Main Title -->
    <text x="600" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#cardShadow)">
      Centralized API Specifications
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="20" font-weight="600" fill="#f8fafc" letter-spacing="0.2">
      A Curated Registry for OpenAPI, AsyncAPI, GraphQL, Protobuf &amp; Avro
    </text>

    <!-- Subtitle Line 2: Tagline -->
    <text x="600" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Design-First Governance &bull; Multi-Format Schema Versioning &bull; Developer Catalog Discovery
    </text>
  </g>

  <!-- Dynamic Floating Feature Pills at Bottom -->
  <g transform="translate(100, 260)" class="spec-pill">
    <!-- Pill 1: OpenAPI 3.1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" filter="url(#cardShadow)"/>
      <circle cx="24" cy="21" r="7" fill="#38bdf8" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">OpenAPI 3.1 &amp; v2</text>
    </g>

    <!-- Pill 2: AsyncAPI -->
    <g transform="translate(195, 0)">
      <rect width="165" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" filter="url(#cardShadow)"/>
      <circle cx="24" cy="21" r="7" fill="#818cf8" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">AsyncAPI 3.0</text>
    </g>

    <!-- Pill 3: GraphQL & Protobuf -->
    <g transform="translate(385, 0)">
      <rect width="215" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" filter="url(#cardShadow)"/>
      <circle cx="24" cy="21" r="7" fill="#c084fc" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Protobuf &amp; gRPC</text>
    </g>

    <!-- Pill 4: Kafka & Avro -->
    <g transform="translate(625, 0)">
      <rect width="185" height="42" rx="21" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" filter="url(#cardShadow)"/>
      <circle cx="24" cy="21" r="7" fill="#ec4899" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Kafka &amp; Avro</text>
    </g>

    <!-- Pill 5: Spectral & Linting -->
    <g transform="translate(835, 0)">
      <rect width="165" height="42" rx="21" fill="#1e293b" stroke="#10b981" stroke-width="1.2" filter="url(#cardShadow)"/>
      <circle cx="24" cy="21" r="7" fill="#10b981" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Style Governance</text>
    </g>
  </g>

  <!-- Sleek Bottom Accent Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#titleGrad)" />
</svg>
