<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .glow-orb-1 {
      animation: floatOrb1 10s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    .pulse-node {
      animation: pulseNode 3s ease-in-out infinite alternate;
    }
    .flow-dash {
      stroke-dasharray: 8, 8;
      animation: dashFlow 20s linear infinite;
    }
    .spec-pill {
      animation: floatPill 6s ease-in-out infinite alternate;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes floatOrb1 {
      0% { opacity: 0.25; transform: translate(0px, 0px); }
      100% { opacity: 0.45; transform: translate(60px, 40px); }
    }
    @keyframes floatOrb2 {
      0% { opacity: 0.25; transform: translate(0px, 0px); }
      100% { opacity: 0.50; transform: translate(-50px, -30px); }
    }
    @keyframes pulseNode {
      0% { opacity: 0.5; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-5px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="glow-orb-1">
    <circle cx="220" cy="130" r="140" fill="#38bdf8" opacity="0.3" />
  </g>
  <g class="glow-orb-2">
    <circle cx="980" cy="270" r="160" fill="#8b5cf6" opacity="0.3" />
  </g>

  <!-- Dynamic Flow Connector Curves in Background (Behind Text) -->
  <g opacity="0.35">
    <path class="flow-dash" d="M 50,330 C 300,370 400,280 600,330 C 800,380 950,290 1150,330" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-dash" d="M 50,80 C 250,30 450,110 600,70 C 800,30 1000,100 1150,60" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Flow Nodes Background Accent -->
  <circle class="pulse-node" cx="250" cy="80" r="6" fill="#38bdf8" />
  <circle class="pulse-node" cx="600" cy="70" r="7" fill="#818cf8" />
  <circle class="pulse-node" cx="950" cy="60" r="6" fill="#c084fc" />
  <circle class="pulse-node" cx="300" cy="330" r="6" fill="#06b6d4" />
  <circle class="pulse-node" cx="600" cy="330" r="7" fill="#8b5cf6" />
  <circle class="pulse-node" cx="900" cy="330" r="6" fill="#ec4899" />

  <!-- Top Badge / Category Pill -->
  <g transform="translate(420, 46)">
    <!-- Shadow plate -->
    <rect x="2" y="3" width="360" height="34" rx="17" fill="#000000" opacity="0.4" />
    <rect width="360" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="22" cy="17" r="5" fill="#10b981" />
    <text x="38" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">
      CENTRALIZED SCHEMA REGISTRY ECOSYSTEM
    </text>
  </g>

  <!-- FOREGROUND: Main Title and Subtitles (Completely Clear and Legible) -->
  <g id="foreground-content">
    <!-- Title Shadow for contrast -->
    <text x="602" y="144" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="44" font-weight="800" fill="#000000" opacity="0.6" letter-spacing="-0.5">
      Centralized API Specifications
    </text>
    <!-- Main Title -->
    <text x="600" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Centralized API Specifications
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="20" font-weight="600" fill="#f8fafc" letter-spacing="0.2">
      A Curated Registry for OpenAPI, AsyncAPI, GraphQL, Protobuf &amp; Avro
    </text>

    <!-- Subtitle Line 2: Tagline -->
    <text x="600" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Design-First Governance &#8226; Multi-Format Schema Versioning &#8226; Developer Catalog Discovery
    </text>
  </g>

  <!-- Dynamic Floating Feature Pills at Bottom -->
  <g transform="translate(100, 260)" class="spec-pill">
    <!-- Pill 1: OpenAPI 3.1 -->
    <g transform="translate(0, 0)">
      <rect x="1" y="2" width="170" height="42" rx="21" fill="#000000" opacity="0.3" />
      <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#38bdf8" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">OpenAPI 3.1 &amp; v2</text>
    </g>

    <!-- Pill 2: AsyncAPI -->
    <g transform="translate(195, 0)">
      <rect x="1" y="2" width="165" height="42" rx="21" fill="#000000" opacity="0.3" />
      <rect width="165" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#818cf8" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">AsyncAPI 3.0</text>
    </g>

    <!-- Pill 3: GraphQL & Protobuf -->
    <g transform="translate(385, 0)">
      <rect x="1" y="2" width="215" height="42" rx="21" fill="#000000" opacity="0.3" />
      <rect width="215" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#c084fc" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Protobuf &amp; gRPC</text>
    </g>

    <!-- Pill 4: Kafka & Avro -->
    <g transform="translate(625, 0)">
      <rect x="1" y="2" width="185" height="42" rx="21" fill="#000000" opacity="0.3" />
      <rect width="185" height="42" rx="21" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#ec4899" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Kafka &amp; Avro</text>
    </g>

    <!-- Pill 5: Style Governance -->
    <g transform="translate(835, 0)">
      <rect x="1" y="2" width="165" height="42" rx="21" fill="#000000" opacity="0.3" />
      <rect width="165" height="42" rx="21" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#10b981" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Style Governance</text>
    </g>
  </g>

  <!-- Sleek Bottom Accent Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#titleGrad)" />
</svg>
