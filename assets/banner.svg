<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes floatOrb1{0%{opacity:.25;transform:translate(0,0)}}@keyframes floatOrb2{0%{opacity:.25;transform:translate(0,0)}}@keyframes pulseNode{0%{opacity:.5;transform:scale(.9)}}@keyframes floatPill{0%{transform:translateY(0)}}.glow-orb-1{animation:floatOrb1 10s ease-in-out infinite alternate}.glow-orb-2{animation:floatOrb2 12s ease-in-out infinite alternate}.pulse-node{animation:pulseNode 3s ease-in-out infinite alternate}.flow-dash{stroke-dasharray:8,8;animation:dashFlow 20s linear infinite}.spec-pill{animation:floatPill 6s ease-in-out infinite alternate}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g class="glow-orb-1"><circle cx="220" cy="130" r="140" fill="#38bdf8" opacity=".3"/></g><g class="glow-orb-2"><circle cx="980" cy="270" r="160" fill="#8b5cf6" opacity=".3"/></g><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 50,330 C 300,370 400,280 600,330 C 800,380 950,290 1150,330" class="flow-dash"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 50,80 C 250,30 450,110 600,70 C 800,30 1000,100 1150,60" class="flow-dash"/></g><circle cx="250" cy="80" r="6" fill="#38bdf8" class="pulse-node"/><circle cx="600" cy="70" r="7" fill="#818cf8" class="pulse-node"/><circle